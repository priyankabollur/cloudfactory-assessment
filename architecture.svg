  <text x="602" y="934" font-size="9.5" fill="#94a3b8">image pulls · weights · metrics</text>

  <!-- ============ SIDEBAR: LEGEND ============ -->
  <rect x="1210" y="192" width="450" height="140" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1234" y="218" font-size="13" font-weight="700" fill="#334155">Legend</text>
  <line x1="1234" y1="242" x2="1288" y2="242" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="1300" y="246" font-size="10.5" fill="#475569">request path</text>
  <line x1="1234" y1="270" x2="1288" y2="270" stroke="#8b5cf6" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ahd)"/>
  <text x="1300" y="274" font-size="10.5" fill="#6d28d9">control / telemetry</text>
  <text x="1234" y="304" font-size="10.5" fill="#64748b">Colour key — one colour per layer:</text>
  <text x="1234" y="324" font-size="10.5" fill="#64748b">edge · routing · serving · compute · state</text>

  <!-- ============ SIDEBAR: DELIVERY & IaC ============ -->
  <rect x="1210" y="348" width="450" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1234" y="374" font-size="13" font-weight="700" fill="#334155">Delivery and IaC</text>
  <text x="1234" y="398" font-size="10.5" fill="#475569">GitLab CI — build · scan · sign → ECR</text>
  <text x="1234" y="422" font-size="10.5" fill="#475569">Argo CD — GitOps sync, drift, revert</text>
  <text x="1234" y="446" font-size="10.5" fill="#475569">Terraform / OpenTofu + Helm — infra</text>
  <text x="1234" y="470" font-size="10.5" fill="#475569">Kyverno — admission policy</text>

  <!-- ============ SIDEBAR: VERSION ROUTING ============ -->
  <rect x="1210" y="556" width="450" height="114" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1234" y="582" font-size="13" font-weight="700" fill="#334155">Version routing (the alias)</text>
  <text x="1234" y="606" font-size="10.5" fill="#475569">/v1/models/{model}/predict → alias</text>
  <text x="1234" y="628" font-size="10.5" fill="#475569">stable 95% · canary 5%</text>
  <text x="1234" y="650" font-size="10.5" fill="#475569">rollback = weight flip &lt; 1 min</text>

  <!-- ============ SIDEBAR: OBSERVABILITY ============ -->
  <rect x="1210" y="722" width="450" height="196" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1234" y="748" font-size="13" font-weight="700" fill="#334155">Observability and cost</text>
  <text x="1234" y="774" font-size="10.5" fill="#475569">AMP + ADOT — metrics</text>
  <text x="1234" y="798" font-size="10.5" fill="#475569">Amazon Managed Grafana — dashboards</text>
  <text x="1234" y="822" font-size="10.5" fill="#475569">CloudWatch — JSON logs, alarms</text>
  <text x="1234" y="846" font-size="10.5" fill="#475569">X-Ray — gateway traces</text>
  <text x="1234" y="870" font-size="10.5" fill="#475569">DCGM — GPU telemetry</text>
  <text x="1234" y="894" font-size="10.5" fill="#475569">OpenCost — per-model cost</text>

  <!-- ============ CONTROL / TELEMETRY ARROWS ============ -->
  <line x1="1210" y1="423" x2="1146" y2="423" stroke="#8b5cf6" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ahd)"/>
  <line x1="1146" y1="820" x2="1210" y2="820" stroke="#8b5cf6" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ahd)"/>

  <!-- ============ FOOTER ============ -->
  <text x="40" y="1130" font-size="10.5" fill="#64748b">Three independent scaling tiers — Tier 1: agentgateway replicas (HPA on RPS + connections) · Tier 2: each InferenceService (KEDA on in-flight concurrency and queue depth) · Tier 3: Karpenter node fleet</text>
  <text x="40" y="1152" font-size="10.5" fill="#64748b">Runtime classes per model: custom-container (default) · vllm (generative) · triton (shared small models). Single region, multi-AZ. State lives in Git, S3 and ECR — no state in inference pods.</text>
</svg>
