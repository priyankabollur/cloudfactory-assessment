  <rect x="332" y="1036" width="248" height="46" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="456" y="1064" font-size="10.5" fill="#334155" text-anchor="middle">CloudTrail — audit</text>
  <rect x="600" y="1036" width="248" height="46" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
