  <text x="64" y="748" font-size="12.5" font-weight="700" fill="#334155">EKS node fleet — all workloads above run here · provisioned by Karpenter · multi-AZ</text>

  <rect x="64" y="778" width="248" height="110" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="82" y="804" font-size="12" font-weight="700" fill="#0f172a">system</text>
