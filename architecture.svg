  <text x="590" y="300" font-size="12.5" fill="#7c2d12" text-anchor="middle">ALB — WAF · ACM TLS · access logs · connection limits</text>

  <!-- ============ AGENTGATEWAY ============ -->
  <rect x="40" y="348" width="1100" height="150" rx="10" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
  <text x="64" y="370" font-size="9" letter-spacing="1.2" fill="#6366f1">ROUTING / DATA PLANE</text>
  <text x="64" y="392" font-size="15" font-weight="700" fill="#312e81">agentgateway — Kubernetes Gateway API data plane (Rust)</text>
  <text x="64" y="411" font-size="10.5" fill="#4c4f8a">3+ replicas across 3 AZs · routes derived from Git · the single intelligent hop on the hot path</text>

  <rect x="64" y="424" width="330" height="30" rx="6" fill="#ffffff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="78" y="444" font-size="10.5" fill="#334155">AuthN / AuthZ · JWT · OIDC</text>
  <rect x="425" y="424" width="330" height="30" rx="6" fill="#ffffff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="439" y="444" font-size="10.5" fill="#334155">Per-tenant + per-model rate limits</text>
  <rect x="786" y="424" width="330" height="30" rx="6" fill="#ffffff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="800" y="444" font-size="10.5" fill="#334155">Model-aware routing · weighted split</text>

  <rect x="64" y="460" width="330" height="30" rx="6" fill="#ffffff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="78" y="480" font-size="10.5" fill="#334155">Timeouts · retries · circuit breaking</text>
  <rect x="425" y="460" width="330" height="30" rx="6" fill="#ffffff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="439" y="480" font-size="10.5" fill="#334155">Request mirroring for shadow tests</text>
  <rect x="786" y="460" width="330" height="30" rx="6" fill="#ffffff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="800" y="480" font-size="10.5" fill="#334155">Per model / version Prometheus + OTel</text>

  <!-- ============ KSERVE INFERENCESERVICES ============ -->
  <rect x="40" y="566" width="257" height="104" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="60" y="594" font-size="12.5" font-weight="700" fill="#065f46">model-a · v1 (previous)</text>
  <text x="60" y="617" font-size="10.5" fill="#047857">RawDeployment · own Service</text>
  <text x="60" y="639" font-size="10.5" fill="#047857">rollback target</text>

  <rect x="321" y="566" width="257" height="104" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="341" y="594" font-size="12.5" font-weight="700" fill="#065f46">model-a · v2 (stable)</text>
  <text x="341" y="617" font-size="10.5" fill="#047857">RawDeployment · own Service</text>
  <text x="341" y="639" font-size="10.5" fill="#047857">own KEDA scaler</text>

  <rect x="602" y="566" width="257" height="104" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
