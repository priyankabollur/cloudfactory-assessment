  <text x="618" y="846" font-size="10.5" fill="#1d4ed8">On-Demand</text>
  <text x="618" y="866" font-size="10.5" fill="#1d4ed8">SLO-bearing models</text>

  <rect x="868" y="778" width="248" height="110" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="886" y="796" font-size="12" font-weight="700" fill="#1e3a8a">gpu-spot</text>
  <text x="886" y="826" font-size="10.5" fill="#1d4ed8">g6 · g5</text>
  <text x="886" y="846" font-size="10.5" fill="#1d4ed8">Spot · tainted</text>
  <text x="886" y="866" font-size="10.5" fill="#1d4ed8">batch · preview</text>

  <!-- ============ SHARED SERVICES ============ -->
  <rect x="40" y="940" width="1100" height="160" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="64" y="966" font-size="12.5" font-weight="700" fill="#334155">Shared AWS services — artifacts, weights, secrets, telemetry</text>

