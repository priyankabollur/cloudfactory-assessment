  <rect width="1700" height="1180" fill="#ffffff"/>

  <!-- ============ TITLE ============ -->
  <text x="40" y="54" font-size="26" font-weight="700" fill="#0f172a">Model Hosting Platform — Architecture Overview</text>
  <text x="40" y="80" font-size="13" fill="#64748b">Multi-model · multi-version inference on Amazon EKS · KServe serving plane · agentgateway routing · independent per-version scaling</text>

  <!-- ============ CALLERS ============ -->
  <rect x="40" y="110" width="1100" height="56" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="590" y="143" font-size="12.5" fill="#334155" text-anchor="middle">Callers — internal services · batch jobs · notebooks · agent clients</text>

  <!-- ============ ROUTE 53 ============ -->
