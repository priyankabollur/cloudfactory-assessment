  <text x="82" y="866" font-size="10.5" fill="#475569">add-ons · controllers</text>

  <rect x="332" y="778" width="248" height="110" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="350" y="804" font-size="12" font-weight="700" fill="#0f172a">cpu-inference</text>
  <text x="350" y="826" font-size="10.5" fill="#475569">c7i · m7i</text>
