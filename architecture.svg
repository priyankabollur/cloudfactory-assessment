  <text x="992" y="1008" font-size="10.5" fill="#334155" text-anchor="middle">Secrets Manager / SSM</text>

  <rect x="64" y="1036" width="248" height="46" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
